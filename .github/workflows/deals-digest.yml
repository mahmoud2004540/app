name: إشعارات الصفقات إلى تيليجرام

# يعمل تلقائيًا حسب الجدول + يمكن تشغيله يدويًا من تبويب Actions للتجربة.
on:
  schedule:
    # كل 4 ساعات (بتوقيت UTC) — يبقى ضمن دقائق GitHub المجانية (2000/شهر) بأمان
    # (~900 دقيقة/شهر). مناسب لتداول السبوت متعدّد الأيام؛ لا نفوّت إعدادات اليومي/6س،
    # وإشارات الساعة تصل بفارق ساعات بسيط لا يؤثّر على صفقة تُمسك أيامًا.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "الأسواق (crypto,stocks,forex) — الافتراضي كريبتو فقط (الأعلى ربحًا)"
        required: false
        default: "crypto"
      timeframe:
        description: "الإطار الزمني (1m,5m,15m,1h,1d)"
        required: false
        default: "15m"
      direction:
        description: "الاتجاه (any,buy,sell)"
        required: false
        default: "any"
      mode:
        description: "digest = إرسال الصفقات؛ backtest = قياس الأداء التاريخي"
        required: false
        default: "digest"
      digest_mode:
        description: "نوع الصفقات (trend = هي دي؛ prepump = ما قبل الاندفاع)"
        required: false
        default: "trend"
      alert_only:
        description: "1 = صفقات الدخول فقط؛ 0 = اعرض المرشّحين للمراقبة أيضًا"
        required: false
        default: "1"
      strategy:
        description: "استراتيجية الباك-تِست (compare,trendsweep,optimize,precision,stopbuffer,...)"
        required: false
        default: "compare"

# لا تشغّل أكثر من نسخة في وقت واحد
concurrency:
  group: deals-digest
  cancel-in-progress: false

# صلاحية الكتابة لحفظ سجل التداول (journal) في المستودع
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: إرسال أفضل الصفقات
        if: ${{ (github.event.inputs.mode || 'digest') != 'backtest' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          MARKETS: ${{ github.event.inputs.markets || 'crypto' }}
          TIMEFRAME: ${{ github.event.inputs.timeframe || '1h' }}
          DIRECTION: ${{ github.event.inputs.direction || 'any' }}
          DIGEST_MODE: ${{ github.event.inputs.digest_mode || 'trend' }}
          # «الدخول فقط»: يبعت الصفقات المؤكّدة اللي تدخلها على طول فقط ويبقى صامتًا
          # في السوق الهابط. فارغ = يأخذ الافتراضي من config.ALERT_ONLY (=True).
          ALERT_ONLY: ${{ github.event.inputs.alert_only || '' }}
          TOP: "5"
        run: python send_digest.py

      - name: باك-تِست الأداء التاريخي
        if: ${{ github.event.inputs.mode == 'backtest' }}
        run: python backtest.py --market crypto --timeframe ${{ github.event.inputs.timeframe || '1h' }} --strategy ${{ github.event.inputs.strategy || 'compare' }}

      - name: حفظ سجل التداول في المستودع
        if: ${{ (github.event.inputs.mode || 'digest') != 'backtest' }}
        run: |
          if [ -n "$(git status --porcelain journal/)" ]; then
            git config user.name "trading-bot"
            git config user.email "bot@users.noreply.github.com"
            git add journal/
            git commit -m "chore(journal): update trade journal [skip ci]"
            # دفع مرن: لو الفرع اتحرّك (تشغيل آخر/دفع متزامن) نعيد الأساس ثم ندفع.
            # سجل التداول إضافة — لا يجب أن يُفشِل التشغيل لو تعذّر الدفع.
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "✅ حُفظ سجل التداول."; break
              fi
              echo "↻ الفرع اتحرّك — إعادة الأساس ثم محاولة الدفع ($attempt)..."
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
            done || true
          else
            echo "لا تغييرات في سجل التداول."
          fi
